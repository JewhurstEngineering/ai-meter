name: CursorUsageTracker
options:
  bundleIdPrefix: com.cursorusagetracker
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "29"
    DEVELOPMENT_TEAM: "6998422DKP"
    CODE_SIGN_STYLE: Automatic
packages:
  CursorUsageCore:
    path: Packages/CursorUsageCore
targets:
  CursorUsageTracker:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/CursorUsageTracker
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.app
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage Tracker
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/CursorUsageTracker/CursorUsageTracker.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: CursorUsageCore
      - target: CursorUsageWidgets
        embed: true
      - sdk: WidgetKit.framework
  CursorUsageWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/CursorUsageWidgets
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/CursorUsageWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Widgets/CursorUsageWidgets/CursorUsageWidgets.entitlements
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - package: CursorUsageCore
schemes:
  CursorUsageTracker:
    build:
      targets:
        CursorUsageTracker: all
        CursorUsageWidgets: all
    run:
      config: Release
    archive:
      config: Release
