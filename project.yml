name: CursorUsageTracker
options:
  bundleIdPrefix: com.cursorusagetracker
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "35"
    DEVELOPMENT_TEAM: "6998422DKP"
    CODE_SIGN_STYLE: Automatic
packages:
  CursorUsageCore:
    path: Packages/CursorUsageCore
targets:
  CursorUsageTracker:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/CursorUsageTracker
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.app
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage Tracker
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/CursorUsageTracker/CursorUsageTracker.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: CursorUsageCore
      - target: CursorUsageWidgets
        embed: true
      - sdk: WidgetKit.framework
  CursorUsageWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/CursorUsageWidgets
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/CursorUsageWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Widgets/CursorUsageWidgets/CursorUsageWidgets.entitlements
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - package: CursorUsageCore
  CursorUsageiOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/CursorUsageiOS
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/iOS/CursorUsageiOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/CursorUsageiOS/CursorUsageiOS.entitlements
    dependencies:
      - package: CursorUsageCore
      - target: CursorUsageiOSWidgets
        embed: true
      - target: CursorUsageWatch
        embed: true
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
  CursorUsageiOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/CursorUsageWidgets
      - Widgets/iOS
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/CursorUsageWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage
        CODE_SIGN_ENTITLEMENTS: Widgets/iOS/CursorUsageiOSWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: CursorUsageCore
  CursorUsageWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/watchOS/CursorUsageWatch
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/watchOS/CursorUsageWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/watchOS/CursorUsageWatch/CursorUsageWatch.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: CursorUsageCore
      - target: CursorUsageWatchWidgets
        embed: true
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
  CursorUsageWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets/watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorusagetracker.ios.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/watchOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Cursor Usage
        CODE_SIGN_ENTITLEMENTS: Widgets/watchOS/CursorUsageWatchWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: CursorUsageCore
schemes:
  CursorUsageTracker:
    build:
      targets:
        CursorUsageTracker: all
        CursorUsageWidgets: all
    run:
      config: Release
    archive:
      config: Release
  CursorUsageiOS:
    build:
      targets:
        CursorUsageiOS: all
        CursorUsageiOSWidgets: all
        CursorUsageWatch: all
        CursorUsageWatchWidgets: all
    run:
      config: Debug
      executable: CursorUsageiOS
    archive:
      config: Release
      revealArchiveInOrganizer: true
