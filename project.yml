name: AIMeter
options:
  bundleIdPrefix: com.jamesware.aimeter
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "36"
    DEVELOPMENT_TEAM: "6998422DKP"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 JamesWare.dev"
packages:
  AIMeterCore:
    path: Packages/AIMeterCore
targets:
  AIMeter:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/CursorUsageTracker
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.app
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/CursorUsageTracker/CursorUsageTracker.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - package: AIMeterCore
      - target: AIMeterWidgets
        embed: true
      - sdk: WidgetKit.framework
  AIMeterWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/CursorUsageWidgets
      - path: Apps/Shared
        excludes:
          - CycleSpendChart.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/CursorUsageWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Widgets/CursorUsageWidgets/CursorUsageWidgets.entitlements
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - package: AIMeterCore
  AIMeteriOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/CursorUsageiOS
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/iOS/CursorUsageiOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/CursorUsageiOS/CursorUsageiOS.entitlements
    dependencies:
      - package: AIMeterCore
      - target: AIMeteriOSWidgets
        embed: true
      - target: AIMeterWatch
        embed: true
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
  AIMeteriOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/CursorUsageWidgets
      - Widgets/iOS
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
          - CycleSpendChart.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/CursorUsageWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        CODE_SIGN_ENTITLEMENTS: Widgets/iOS/CursorUsageiOSWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: AIMeterCore
  AIMeterWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/watchOS/CursorUsageWatch
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
          - CycleSpendChart.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/watchOS/CursorUsageWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/watchOS/CursorUsageWatch/CursorUsageWatch.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: AIMeterCore
      - target: AIMeterWatchWidgets
        embed: true
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
  AIMeterWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets/watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/watchOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        CODE_SIGN_ENTITLEMENTS: Widgets/watchOS/CursorUsageWatchWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: AIMeterCore
schemes:
  AIMeter:
    build:
      targets:
        AIMeter: all
        AIMeterWidgets: all
    run:
      config: Release
    archive:
      config: Release
  AIMeteriOS:
    build:
      targets:
        AIMeteriOS: all
        AIMeteriOSWidgets: all
        AIMeterWatch: all
        AIMeterWatchWidgets: all
    run:
      config: Debug
      executable: AIMeteriOS
    archive:
      config: Release
      revealArchiveInOrganizer: true
