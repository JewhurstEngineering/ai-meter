name: AIMeter
options:
  bundleIdPrefix: com.jamesware.aimeter
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "43"
    DEVELOPMENT_TEAM: "6998422DKP"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 JamesWare.dev"
packages:
  AIMeterCore:
    path: Packages/AIMeterCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  AIMeter:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/AIMeter
      - path: Apps/Shared
    info:
      path: Apps/macOS/AIMeter/Info.plist
      properties:
        CFBundleName: AI Meter
        CFBundleDisplayName: AI Meter
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 JamesWare.dev"
        SUEnableAutomaticChecks: true
        SUFeedURL: https://github.com/JewhurstEngineering/ai-meter/releases/latest/download/appcast.xml
        SUPublicEDKey: qijKx335WMhnQRru81bLR+sN8uoaHJ0SjzwaFP1Lg7M=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.app
        PRODUCT_NAME: AI Meter
        PRODUCT_MODULE_NAME: AIMeter
        INFOPLIST_FILE: Apps/macOS/AIMeter/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/AIMeter/AIMeter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_DEBUG_DYLIB: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    dependencies:
      - package: AIMeterCore
      - package: Sparkle
      - target: AIMeterWidgets
        embed: true
      - sdk: WidgetKit.framework
  AIMeterWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/AIMeterWidgets
      - path: Apps/Shared
        excludes:
          - CycleSpendChart.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/AIMeterWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Widgets/AIMeterWidgets/AIMeterWidgets.entitlements
        SKIP_INSTALL: YES
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - package: AIMeterCore
  AIMeteriOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/AIMeteriOS
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/iOS/AIMeteriOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/AIMeteriOS/AIMeteriOS.entitlements
    dependencies:
      - package: AIMeterCore
      - target: AIMeteriOSWidgets
        embed: true
      - target: AIMeterWatch
        embed: true
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
  AIMeteriOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/AIMeterWidgets
      - Widgets/iOS
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
          - CycleSpendChart.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/AIMeterWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        CODE_SIGN_ENTITLEMENTS: Widgets/iOS/AIMeteriOSWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: AIMeterCore
  AIMeterWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/watchOS/AIMeterWatch
      - path: Apps/Shared
        excludes:
          - Assets.xcassets/AppIcon.appiconset
          - CycleSpendChart.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/watchOS/AIMeterWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/watchOS/AIMeterWatch/AIMeterWatch.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: AIMeterCore
      - target: AIMeterWatchWidgets
        embed: true
      - sdk: WidgetKit.framework
      - sdk: WatchConnectivity.framework
  AIMeterWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets/watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/watchOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Meter
        CODE_SIGN_ENTITLEMENTS: Widgets/watchOS/AIMeterWatchWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: AIMeterCore
  AIMeterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIMeterTests
    dependencies:
      - target: AIMeter
      - package: AIMeterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AI Meter.app/Contents/MacOS/AI Meter"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  AIMeteriOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AIMeteriOSTests
    dependencies:
      - target: AIMeteriOS
      - package: AIMeterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AIMeteriOS.app/AIMeteriOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
  AIMeteriOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AIMeteriOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesware.aimeter.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AIMeteriOS
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
schemes:
  AIMeter:
    build:
      targets:
        AIMeter: all
        AIMeterWidgets: all
        AIMeterTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - AIMeterTests
    archive:
      config: Release
  AIMeteriOS:
    build:
      targets:
        AIMeteriOS: all
        AIMeteriOSWidgets: all
        AIMeterWatch: all
        AIMeterWatchWidgets: all
        AIMeteriOSTests: [test]
        AIMeteriOSUITests: [test]
    run:
      config: Debug
      executable: AIMeteriOS
    test:
      config: Debug
      targets:
        - AIMeteriOSTests
        - AIMeteriOSUITests
    archive:
      config: Release
      revealArchiveInOrganizer: true
