name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: AIMeterCore tests
        working-directory: Packages/AIMeterCore
        run: swift test

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Mac unit tests
        run: |
          xcodebuild test \
            -project AIMeter.xcodeproj \
            -scheme AIMeter \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: iOS + Watch compile
        run: |
          xcodebuild build \
            -project AIMeter.xcodeproj \
            -scheme AIMeteriOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath .ci/DerivedData-ios-build \
            CODE_SIGNING_ALLOWED=NO

      # In-process unit tests, not XCUITest. GitHub-hosted runners fail
      # XCUIApplication.launch() with "Failed to get background assertion".
      - name: iOS Simulator smoke
        run: |
          DESTINATION="$(python3 Scripts/ci-iphone-destination.py)"
          echo "Using $DESTINATION"
          UDID="${DESTINATION##*id=}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test \
            -project AIMeter.xcodeproj \
            -scheme AIMeteriOS \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath .ci/DerivedData-ios-test \
            -only-testing:AIMeteriOSTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
